name: Watchdog — Multimodal AI

on:
  schedule:
    - cron: '25 12 * * 1'
    - cron: '25 16 * * 1'
    - cron: '25 2 * * 2'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Check if weekly report exists
        id: check
        run: |
          WEEK=$(date +%G-W%V)
          REPORT="output/weekly/${WEEK%%-*}/${WEEK}.md"
          echo "Checking: $REPORT"
          if [ -f "$REPORT" ]; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "✅ Report exists: $REPORT"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "❌ Missing report: $REPORT — will trigger weekly workflow"
          fi

      - name: Trigger weekly workflow
        if: steps.check.outputs.EXISTS == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly-digest.yml',
              ref: context.ref,
            });
            console.log('Triggered weekly-digest.yml');
