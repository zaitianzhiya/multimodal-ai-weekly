# 多模态AI — 评价体系配置

# 六维影响力权重
weights:
  technical_breakthrough: 25  # 技术突破度 — 多模态理解/生成能力的本质提升
  industry_impact: 25         # 行业影响力 — 对多模态产业格局的冲击
  ecosystem_value: 20         # 生态价值 — 开源/API 开放对开发者生态的价值
  model_capability: 15        # 模型能力 — 在基准测试和实际体验中的表现
  business_signal: 10         # 商业信号 — 融资/收购/人才流动/战略调整
  time_sensitivity: 5         # 时间敏感性 — 事件的即时性和不可逆性

# 置信度评分（跨生态独立源交叉验证）
scoring:
  tier_1_weight: 40      # Tier 1 源每个 40 分
  tier_2_weight: 25      # Tier 2 源每个 25 分
  max_score: 100         # 封顶
  min_score_for_A: 80    # A 级 = 2 个 Tier1 生态或等价组合
  min_score_for_B: 60    # B 级 = Tier1 + Tier2 交叉验证
  min_score_for_C: 40    # C 级 = 单一 Tier1 源确认
                          # D 级 = 40 以下

# 质量过滤阈值
filter:
  min_title_length: 10     # 标题最短
  min_desc_length: 30      # 描述最短
  require_citation: true   # 必须有关联源
  max_age_days: 14         # 最多 14 天前


# 六维分类体系
categories:
  - id: "vision_understanding"
    name: "视觉理解"
    label: "#vision"
    description: "图像/视频理解、OCR、视觉问答、视觉定位、视觉推理"

  - id: "image_generation"
    name: "图像生成"
    label: "#image-gen"
    description: "文生图、图生图、图像编辑、风格迁移、可控生成"

  - id: "video_generation"
    name: "视频生成"
    label: "#video-gen"
    description: "文生视频、图生视频、视频编辑、视频续写、实时视频"

  - id: "audio_speech"
    name: "语音与音频"
    label: "#audio"
    description: "语音识别、语音合成、音乐生成、音频理解、声纹"

  - id: "omni_architecture"
    name: "全模态统一架构"
    label: "#omni"
    description: "any-to-any模型、统一多模态架构、跨模态融合、全模态理解"

  - id: "industry_ecosystem"
    name: "产业生态"
    label: "#industry"
    description: "融资、收购、人才、战略调整、开源发布、API 开放"

