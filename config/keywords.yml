  - "multimodal understanding"
  - "visual grounding"
  - "视觉理解"
  - "多模态推理"
  - "cross-modal"
  - "any-to-any"
  - "全模态"
  - "omni-modal"
  - "unified architecture"
  - "融合"

  # 图像
  - "image generation"
  - "text-to-image"
  - "文生图"
  - "image editing"
  - "inpainting"
  - "photorealistic"
  - "可控生成"

  # 视频
  - "video generation"
  - "text-to-video"
  - "文生视频"
  - "video editing"
  - "video understanding"
  - "实时视频"

  # 语音
  - "speech recognition"
  - "speech synthesis"
  - "TTS"
  - "voice cloning"
  - "语音合成"
  - "voice assistant"
  - "实时语音"

  # 突破
  - "SOTA"
  - "state-of-the-art"
  - "首次"
  - "突破"
  - "开源"
  - "open source"
  - "benchmark"

